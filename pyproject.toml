[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "body-mcp"
version = "0.4.0"
description = "Lightweight, local-first MCP server that gives coding agents eyes, ears, hands, and safety reflexes."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Body-MCP contributors" }]
keywords = ["mcp", "model-context-protocol", "computer-use", "agents", "automation", "playwright"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Software Development :: Testing",
    "Topic :: Utilities",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "mcp>=2,<3",
    "playwright>=1.65",
]

# The core stays light: desktop capture/OCR and voice are optional and lazily
# imported, so a missing extra degrades one capability instead of the server.
[project.urls]
Homepage = "https://github.com/sspublisher2005-gif/body-mcp"
Documentation = "https://github.com/sspublisher2005-gif/body-mcp#readme"
Issues = "https://github.com/sspublisher2005-gif/body-mcp/issues"

[project.optional-dependencies]
desktop = [
    "mss>=10.0.0",
    "pytesseract>=0.3.13",
    "Pillow>=10.0.0",
]
voice = [
    "sounddevice>=0.5.6",
    "faster-whisper>=1.2.1",
    "numpy>=1.26",
]
all = [
    "mss>=10.0.0",
    "pytesseract>=0.3.13",
    "Pillow>=10.0.0",
    "sounddevice>=0.5.6",
    "faster-whisper>=1.2.1",
    "numpy>=1.26",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    # tests/test_tools.py and tests/test_voice.py generate audio arrays; this is
    # a TEST dependency, never imported by the server at runtime.
    "numpy>=1.26",
]

[project.scripts]
body-mcp = "body_mcp.server:main"
body-doctor = "body_mcp.doctor:main"

[tool.hatch.build.targets.wheel]
packages = ["src/body_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # third-party: sounddevice reshapes a NumPy array internally (deprecated in NumPy 2.5)
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "SIM", "ISC"]
ignore = ["E501", "SIM103"]
