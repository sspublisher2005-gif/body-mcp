name: publish

# Publishes the wheel to PyPI with **Trusted Publishing** (no API token in the
# repo). One-time setup, on pypi.org:
#   1. create the project "body-mcp" (or claim the name) as sspublisher2005-gif
#   2. Settings -> Publishing -> add a GitHub publisher:
#        owner  sspublisher2005-gif
#        repo   body-mcp
#        workflow publish.yml
#        environment pypi  (create this environment in the repo first)
# Then: create a GitHub release (or press Run workflow) and the wheel goes up.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # the token PyPI exchanges for the upload
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build the wheel and the sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
