name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: install the package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # --with-deps is Linux-only; on Windows plain `install chromium` is right.
      - name: install the browser (Linux system deps)
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium

      - name: install the browser (Windows)
        if: runner.os == 'Windows'
        run: python -m playwright install chromium

      - name: ruff
        run: python -m ruff check .

      - name: pytest
        run: python -m pytest -q

      - name: doctor (read-only, changes nothing)
        run: python -m body_mcp.doctor

      - name: package build + packaging test
        run: |
          python -m pip install --upgrade build
          python -m build
          python -m pytest -q tests/test_packaging.py
